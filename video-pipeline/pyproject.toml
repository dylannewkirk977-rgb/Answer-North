[project]
name = "korvellan-video"
version = "0.1.0"
description = "Korvellan Studios video pipeline: clipper and faceless video recipes"
authors = [
    { name = "Korvellan Studios" }
]
requires-python = ">=3.13"
dependencies = [
    "faster-whisper>=1.2.1",
    "nvidia-cublas-cu12>=12.8,<12.9.3 ; sys_platform == 'win32'",
    "nvidia-cudnn-cu12>=9,<10 ; sys_platform == 'win32'",
    "opencv-python-headless>=5.1.0.95",
    "pyyaml>=6.0.4",
]

[project.scripts]
korvellan-video = "korvellan_video:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
