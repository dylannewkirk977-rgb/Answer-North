# Korvellan Studios video pipeline settings.
# Model names and endpoints live here (not in code) so they can move between GPUs.

# Where results go. Relative paths are relative to this folder.
# Never point this at the F: drive.
output_dir: output

transcribe:
  model: large-v3-turbo   # Whisper model. "small" is faster but less accurate.
  device: cuda            # "cuda" = RTX 5070, "cpu" = fallback
  compute_type: float16
  language: null          # null = auto-detect, or force one like "en"
  hotwords: "Korvellan Studios"  # names/terms Whisper should spell correctly

llm:
  base_url: http://localhost:11434   # Ollama (native API)
  model: qwen3.5:9b
  context_tokens: 16384   # how much text the model can read per request
  think: false            # true = model reasons before answering (slower, sometimes better)
  temperature: 0.3        # lower = more consistent picks
  timeout_seconds: 600

clipper:
  min_seconds: 20         # shortest clip
  max_seconds: 60         # longest clip
  max_clips: 10           # how many clips to keep per video
  min_score: 6            # drop clips the AI scores below this (1-10)
  chunk_minutes: 5        # transcript is read in pieces this long
  chunk_overlap_seconds: 30
  rank_with_thinking: true  # let the AI reason during the final ranking (one request, worth it)
  # Optional: tell the AI about the content/channel and what makes a good clip.
  style_notes: ""

render:
  layout: blur            # "blur" = full frame on blurred background (gaming), "crop" = fill screen (talking head)
  video_encoder: h264_nvenc  # RTX 5070 hardware encoder; "libx264" = CPU fallback
  quality: 23             # lower = better quality, bigger files (18-26 is sensible)
  max_mbps: 10            # bitrate cap; Shorts/TikTok/Reels don't benefit from more

captions:
  enabled: true
  font: Arial Black       # any installed Windows font
  font_size: 100
  outline: 7              # black outline thickness
  highlight_color: "#FFE600"  # color of the word being spoken
  max_words: 3            # words on screen at once
  max_chars: 16           # ...or fewer, if the words are long (keeps one line at font_size 100)
  margin_bottom: 470      # distance from the bottom edge (470 = just below the gameplay in "blur")
